server.port=8080
spring.application.name=USERSERVICE


## Database
spring.datasource.url=jdbc:mysql://localhost:3306/ms_userDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ms_userDB_user
spring.datasource.password=0408@ms_userDB

## JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
spring.config.import=configserver:http://localhost:8084

# Circuit Breaker
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.slowCallDurationThreshold=2000
resilience4j.circuitbreaker.instances.getAllUsersCircuitBreaker.slowCallRateThreshold=50

resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.slowCallDurationThreshold=2000
resilience4j.circuitbreaker.instances.getUserByIdCircuitBreaker.slowCallRateThreshold=50

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.endpoint.circuitbreakers.enabled=true